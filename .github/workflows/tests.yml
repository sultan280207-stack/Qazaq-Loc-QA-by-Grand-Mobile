name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[test]
      - name: Tests
        run: python -m pytest -q
      - name: Demo run on the test files
        run: |
          mkdir -p demo
          locqa check --source tests/fixtures/src_ru.arb --target tests/fixtures/tgt_kk.arb \
            --glossary tests/fixtures/glossary.csv --ref tests/fixtures/ref_uz.arb --out demo/report.json
          locqa fix --source tests/fixtures/src_ru.arb --target tests/fixtures/tgt_kk.arb \
            --report demo/report.json --out demo/tgt_kk_fixed.arb || true
          locqa review-page --report demo/report.json --out demo/review.html --name tgt_kk.arb
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: demo-report
          path: demo/
